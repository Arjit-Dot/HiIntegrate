# =============================================================================
# REFERENCE CONFIG: the "mother of all configs"
# =============================================================================
#
# One file that uses EVERY field in the config schema once, with a comment on
# what each field means (WHAT) and which decision it comes from (WHY).
#
# - The service here is FICTIONAL ("Example Platform"). Its endpoints and
#   responses are made up so we claim nothing about a real API.
# - It lives in docs/, not templates/, because it is a teaching example, not a
#   usable integration. Real configs go in templates/.
# - It must pass the validator once the validator exists (add it as a test).
# - Decision references (D-2.x and so on) point to docs/decisions.md.
#
# Names that are NOT fixed by a decision yet. They are finalized when
# schema/integration.schema.json is written:
#   - the value of `version`
#   - the keys inside `defaults` (timeout_seconds, retry.*, headers)
#   - `values` as the key that lists an enum input's allowed values
#   - the shape of `incremental` (shown commented out, no v1 service uses it)
#   - the pattern accepted by `format` on a datetime map entry
#
# RULES THE VALIDATOR ENFORCES (D-2.14, D-2.17, D-2.21)
#   1. A `pull` action must not declare `inputs`.
#   2. A `lookup` action must declare `inputs`.
#   3. {{input.x}} may appear only inside a `lookup` action.
#   4. Every name in an action's `required` list must exist in its `map`.
#   5. `secret` must look like a name, never a key.
#   6. `target_schema` must be user, device or alert.
#   7. {{ }} scopes are only vars, input, state, plus {{now}} / {{now - 24h}}.
#   8. base_url may use {{vars.x}} only.
#   9. Unknown keys anywhere are errors, reported with their path.
#
# RESERVED, NOT IMPLEMENTED (D-2.22). The validator says "not implemented yet":
#   response_format (only json works), mode: webhook, fan-out (list then detail
#   calls), auth type oauth2_client_credentials.
# =============================================================================


# ---------------------------------------------------------------------------
# IDENTITY
# ---------------------------------------------------------------------------

# WHAT: version of the config schema this file follows. REQUIRED.
# WHY:  lets the platform keep reading old configs after the schema changes.
version: 1

# WHAT: the integration's ID, a slug (lowercase letters, digits, - or _). REQUIRED.
# WHY:  it is the ID used in API routes such as /integrations/example-platform.
name: example-platform

# WHAT: the human label shown in the dashboard. Optional.
# WHY:  the slug is for machines, the label is for people.
display_name: "Example Platform"

# WHAT: a group label for filtering the integrations list. Optional, default
#       `other`. Allowed: identity, threat_intel, ticketing, alerting, other.
# WHY:  display only. It never changes how the engine behaves.
category: identity

# WHAT: free text describing the integration. Optional.
description: "Fictional platform used to show every field in the config schema."

# WHAT: whether scheduled runs happen. Optional, default true.
# WHY:  turn a connection off without deleting it. A disabled connection shows
#       as `disabled` in health (D-5.2), whatever its last run did.
enabled: true


# ---------------------------------------------------------------------------
# CONNECTION
# ---------------------------------------------------------------------------

# WHAT: static values you define once and reuse as {{vars.name}}. Optional.
# WHY:  change the tenant or page size in one line instead of editing every
#       action. Vars are NOT secrets: they are plain, shareable settings (D-2.5).
vars:
  domain: "acme"
  page_size: 200

# WHAT: what a user must supply when adding this integration. Optional.
#       `vars` lists values to ask for (with a label and an example).
#       `secrets` lists the secret NAMES the user must set.
# WHY:  the add form builds its input fields from this block, so picking a
#       template tells the user exactly what to enter. Supports bonus B-5 (D-2.18).
requires:
  vars:
    domain: { label: "Tenant domain", example: "acme" }
  secrets: [example_token]

# WHAT: root URL of the service. REQUIRED.
# WHY:  {{vars.x}} is allowed here so one template works for any tenant, as
#       Jira and Okta put the tenant in the domain. Only `vars` is allowed,
#       because the URL must be fixed before a run starts (D-2.17).
base_url: "https://{{vars.domain}}.example-platform.com"

# WHAT: how the engine logs in. REQUIRED. One auth block per config.
# WHY:  every auth block names its secret with `secret:`. The value is looked up
#       at run time, so this file is safe to share (D-2.3, D-7).
#
#   type: api_key  a key sent in a header or the query string
#   type: bearer   Authorization: Bearer <token>        e.g. { type: bearer, secret: my_token }
#   type: basic    a username and a password or token   e.g. { type: basic, username: me@acme.com, secret: my_token }
#                  (the username is NOT a secret, so it sits in the file)
#   type: oauth2_client_credentials   reserved, rejected as "not supported yet"
auth:
  type: api_key
  # `in` is header or query. For a query key, use `in: query` and `name: api_key`.
  in: header
  name: Authorization
  # WHAT: text placed before the secret, so the header reads `Token <secret>`.
  # WHY:  many APIs want `SSWS <token>` or `Token <key>`, not a bare key. Without
  #       `prefix` the stored secret would have to contain it (D-2.16).
  prefix: "Token "
  # WHAT: the NAME of the secret, never its value. Letters, digits, underscores.
  secret: example_token

# WHAT: settings shared by every action. Optional. Any action can override them.
# WHY:  the engine already has these as BUILT-IN defaults, so a config with no
#       `defaults` block still retries, waits on 429 and quarantines. Use this
#       block only to change them (D-2.10, D-2.11, D-2.20).
defaults:
  timeout_seconds: 30
  headers: { Accept: "application/json" }
  retry:
    # 3 attempts in total, waiting 1, 2 then 4 seconds. Retries timeouts, dropped
    # connections and 5xx. NEVER 4xx: a wrong key or bad request would only repeat.
    max_attempts: 3
    backoff_seconds: [1, 2, 4]
    retry_on: [timeout, connection_error, "5xx"]
  rate_limit:
    # On a 429 the engine waits for `Retry-After`, or uses the backoff if the
    # header is missing. If the wait would exceed this cap, the run FAILS with a
    # clear `rate_limited` error instead of freezing (D-2.11).
    max_wait_seconds: 60
    # WHAT: minimum gap between requests to this service. Default: none.
    # WHY:  slows the engine down BEFORE a 429, not only after one (D-2.20).
    min_interval_ms: 100

# WHAT: an email alert for repeated failures. Optional (bonus B-4).
# WHY:  one email is sent when the number of failed runs in a row reaches
#       `after_failures` (default 3). It does not repeat while the connection
#       stays broken, and it resets after a success. Mail server settings are
#       platform-wide, so only the recipients live here (D-5.3).
alerts:
  after_failures: 3
  to: ["secops@example.com"]


# ---------------------------------------------------------------------------
# ACTIONS: the things this config can do. REQUIRED.
# Each action chooses its own mode and target schema (D-1, D-2.2).
# ---------------------------------------------------------------------------
actions:

  # ===========================================================================
  # ACTION 1: a PULL that fills the USER schema
  # `pull` = scheduled, paginated, many records, runs in the background.
  # ===========================================================================
  #
  # Response this action expects (a list of users):
  #   [ { "id": 101, "profile": { "displayName": "Ada L", "login": "ada",
  #                               "email": "ADA@Acme.com" },
  #       "state": "ACTIVE", "lastLoginAt": 1767225600 } ]
  list_users:
    # WHAT: `pull` (bulk, scheduled) or `lookup` (one record on demand). REQUIRED.
    # WHY:  they are different jobs. The mode decides which other fields are
    #       allowed (see the rules at the top).
    mode: pull

    # WHAT: which schema the records are stored in: user, device or alert. REQUIRED.
    # WHY:  set PER ACTION so one config can fill several types (D-2.2). The
    #       fields below must be that schema's fields (D-3).
    target_schema: user

    # WHAT: how often the scheduler runs this pull. `every <N><unit>`, unit s, m,
    #       h or d. Minimum 10 seconds. PULL ONLY.
    # WHY:  plain words are easy to read, and the 10-second floor lets the demo
    #       run fast enough to watch. No cron in v1 (D-2.9).
    schedule: every 5m

    # WHAT: the HTTP call. `method` and `path` are required, the rest optional.
    # WHY:  {{vars.x}} fills the page size. {{input.x}} is NOT allowed here,
    #       because this is a pull.
    request:
      method: GET
      path: /api/v1/users
      query: { limit: "{{vars.page_size}}" }
      headers: {}
      # body: { ... }   # for POST requests

    # WHAT: how to ask for the next page. PULL ONLY.
    # WHY:  four styles are defined. At least two must work (FR-3). `max_pages`
    #       (default 100) stops a misbehaving service from looping forever (D-2.8).
    pagination:
      type: next_link       # the response contains a link to the next page
      source: header        # header or body
      header: Link          # for `source: body`, use `path:` instead
      max_pages: 100
      #
      # The other three styles, for reference:
      #   { type: offset, offset_param: offset, limit_param: limit, limit: 100, total_path: meta.total }
      #   { type: page_number, param: page, start: 1, stop_when_empty: true }
      #   { type: cursor, cursor_param: after, next_cursor_path: meta.next }

    # WHAT: where the list of records sits in the response (JMESPath).
    # WHY:  "@" means the response itself is the list. Some services wrap it,
    #       for example `data.items`. JMESPath is used for EVERY path, so the
    #       Test preview in the browser follows the same rules as the backend (D-2.6).
    records_path: "@"

    # WHAT: translate the service's fields into OUR fields (the user schema).
    # WHY:  this is the whole point of a common schema. A value can be a plain
    #       path (shorthand) or an object (D-2.7). The platform adds `source`
    #       and `fetched_at` itself, so they are never mapped here.
    map:
      # Object with `transform`: convert the value's type. Allowed: string, int,
      # float, bool, lowercase, uppercase, datetime.
      id: { path: id, transform: string }

      # Shorthand: just a path. `||` means "use the first one that exists", plain
      # JMESPath, so no extra feature was needed.
      name: "profile.displayName || profile.login"

      # `lowercase` so the same person matches across services.
      email: { path: profile.email, transform: lowercase }

      # `value_map` turns the service's words into OUR fixed list. `default`
      # applies when the path is missing or null. Quote "true"/"false" keys.
      # The user `status` list: active, inactive, suspended, unknown (D-3.1).
      status:
        path: state
        value_map: { ACTIVE: active, SUSPENDED: suspended, DEPROVISIONED: inactive }
        default: unknown

      # `datetime` detects ISO 8601 or epoch seconds/milliseconds on its own and
      # always outputs ISO 8601 UTC (FR-5). `format` is optional and only for
      # unusual date text.
      last_login:
        path: lastLoginAt
        transform: datetime
        # format: "%d/%m/%Y %H:%M"

    # WHAT: our fields every record MUST have, beyond the platform minimum
    #       (`id` and `source`). Every name must exist in `map`.
    # WHY:  a config can ADD to the minimum, never remove from it (D-3.4).
    required: [id, email]

    # WHAT: what to do with a record that breaks the rules.
    #       `quarantine` (default): save it with the reason and the original record.
    #       `skip`: drop it, still counted as invalid.
    # WHY:  one bad record in 500 must not discard the other 499, and a silent
    #       drop hides problems, so quarantine is the default (D-2.12, D-4).
    on_invalid: quarantine

    # WHAT: whether results are saved. Default true.
    # WHY:  `false` returns a result without saving it (D-2.4).
    store: true

    # WHAT: fetch only what is new since the last successful run. PULL ONLY.
    # WHY:  kept in the schema from day one so bonus B-1 can be added without a
    #       contract change. No v1 service uses it, so it is commented out and
    #       its shape is not fixed yet.
    # incremental: { param: since, value: "{{state.last_success_at}}" }

  # ===========================================================================
  # ACTION 2: a PULL that fills the ALERT schema
  # Shows time placeholders, a body-level error check, offset paging, and
  # per-action overrides.
  # ===========================================================================
  #
  # Response this action expects:
  #   { "ok": true, "meta": { "total": 250 },
  #     "events": [ { "id": "e1", "eventType": "login.failed", "level": "warning",
  #                   "time": "2026-01-01T09:00:00Z", "message": "Bad password" } ] }
  # A wrong token returns HTTP 200 with { "ok": false, "error": "invalid_auth" }.
  list_alerts:
    mode: pull
    target_schema: alert
    schedule: every 1m

    request:
      method: GET
      path: /api/v1/events
      # WHAT: {{now}} and {{now - <N><unit>}} (units s, m, h, d) give ISO 8601 UTC.
      # WHY:  alert and event APIs ask for "since" and "until". {{state.x}} only
      #       covers incremental sync. This is the one place placeholders do
      #       arithmetic (D-2.19).
      query: { since: "{{now - 24h}}", until: "{{now}}" }

    pagination:
      type: offset
      offset_param: offset
      limit_param: limit
      limit: 100
      total_path: meta.total   # optional: lets the engine know when to stop
      max_pages: 20

    records_path: events

    # WHAT: a condition on the response BODY that means "this is an error",
    #       plus where the message is. Optional.
    # WHY:  some APIs answer HTTP 200 with {"ok": false}. Without this check a
    #       wrong key would look like a success and break the wrong-key test.
    #       The run fails and records the message (D-2.15).
    error_when: { path: ok, equals: false, message_path: error }

    map:
      id: id
      type: eventType
      # The alert `severity` list: low, medium, high, critical, unknown (D-3.3).
      severity:
        path: level
        value_map: { info: low, warning: medium, error: high, critical: critical }
        default: unknown
      timestamp: { path: time, transform: datetime }
      description: message

    required: [id, timestamp]

    # `skip` instead of `quarantine`: an unreadable alert is dropped, only counted.
    on_invalid: skip

    # WHAT: overrides of `defaults` for THIS action only.
    # WHY:  alerts are fetched often, so ask for a larger retry budget and a
    #       longer gap between requests than the rest of the config (D-2.10, D-2.20).
    retry: { max_attempts: 5 }
    rate_limit: { min_interval_ms: 500 }

  # ===========================================================================
  # ACTION 3: a LOOKUP that fills the DEVICE schema
  # `lookup` = on demand, driven by inputs, returns ONE record immediately.
  # ===========================================================================
  #
  # Response this action expects (one device, not a list):
  #   { "id": "d9", "hostname": "ada-laptop", "os": { "name": "macOS" },
  #     "networkInterfaces": [ { "address": "10.0.0.7" } ],
  #     "owner": { "name": "Ada L" }, "lastSeen": "2026-01-01T09:00:00Z" }
  get_device:
    mode: lookup
    target_schema: device

    # WHAT: the values the CALLER must supply, each with a type. LOOKUP ONLY.
    # WHY:  types are checked BEFORE any request, so a typo like `ip: "hello"`
    #       is rejected without spending a request or a rate-limit slot.
    #       Types: string, int, ip (IPv4 or IPv6), domain, hash, enum (D-2.13).
    inputs:
      hostname: { type: string, required: true }
      detail: { type: enum, values: [basic, full], required: true }
      # ip:     { type: ip,     required: false }
      # limit:  { type: int,    required: false }

    request:
      method: GET
      # WHAT: {{input.x}} fills the path from the caller's value. Allowed ONLY
      #       in a lookup (D-2.5).
      path: "/api/v1/devices/{{input.hostname}}"
      query: { detail: "{{input.detail}}" }

    # No `schedule`, `pagination` or `incremental`: those are pull-only.
    # "@" means the whole response IS the record.
    records_path: "@"

    map:
      id: id
      hostname: hostname
      ip: "networkInterfaces[0].address"
      os: "os.name"
      # 'unassigned' (single quotes) is a JMESPath literal, a fixed fallback value.
      owner: "owner.name || 'unassigned'"
      last_seen: { path: lastSeen, transform: datetime }

    required: [id]
    on_invalid: quarantine

    # Return the answer to the caller without saving it (D-2.4).
    store: false
