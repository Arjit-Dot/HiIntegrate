# STEP 1 config: one action, written the way a person would after looking at the first few records.
# It is too strict on purpose: some people have their address in "mail", and two statuses are not in the map.
version: 1
name: demo-acme
display_name: "Demo: Acme HR"
category: other
description: "The demo mock service playing an HR system that sends some messy records."
enabled: true
requires:
  secrets: [mock_token]
base_url: "http://mock-api:8001"
auth: { type: api_key, in: header, name: Authorization, prefix: "SSWS ", secret: mock_token }
actions:
  list_users:
    mode: pull
    target_schema: user
    schedule: every 1h
    request: { method: GET, path: /hr/users }
    records_path: "@"
    map:
      id: { path: id, transform: string }
      name: name
      email: { path: email, transform: lowercase }
      status: { path: status, value_map: { ACTIVE: active, TERMINATED: inactive } }
      last_login: { path: last_login, transform: datetime }
    required: [id, email]
    on_invalid: quarantine

  get_user:
    mode: lookup
    target_schema: user
    inputs:
      id: { type: string, required: true }
    request: { method: GET, path: "/hr/users/{{input.id}}" }
    records_path: "@"
    map:
      id: { path: id, transform: string }
      name: name
      email: { path: email, transform: lowercase }
      status: { path: status, value_map: { ACTIVE: active, TERMINATED: inactive } }
      last_login: { path: last_login, transform: datetime }
    required: [id, email]
    on_invalid: quarantine
