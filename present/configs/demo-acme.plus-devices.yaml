# STEP 3 config: the SAME integration with a second action added (an edit in place, D-15). Everything in
# list_users is the fixed version, so the earlier fix is kept.
version: 1
name: demo-acme
display_name: "Demo: Acme HR"
category: other
description: "The demo mock service playing an HR system that sends some messy records."
enabled: true
requires:
  secrets: [mock_token]
base_url: "http://mock-api:8001"
auth: { type: api_key, in: header, name: Authorization, prefix: "SSWS ", secret: mock_token }
actions:
  list_users:
    mode: pull
    target_schema: user
    schedule: every 1h
    request: { method: GET, path: /hr/users }
    records_path: "@"
    map:
      id: { path: id, transform: string }
      name: name
      email: { path: "email || mail", transform: lowercase }
      status: { path: status, value_map: { ACTIVE: active, TERMINATED: inactive, ON_LEAVE: suspended, PENDING: inactive } }
      last_login: { path: last_login, transform: datetime }
    required: [id, email]
    on_invalid: quarantine

  get_user:
    mode: lookup
    target_schema: user
    inputs:
      id: { type: string, required: true }
    request: { method: GET, path: "/hr/users/{{input.id}}" }
    records_path: "@"
    map:
      id: { path: id, transform: string }
      name: name
      email: { path: "email || mail", transform: lowercase }
      status: { path: status, value_map: { ACTIVE: active, TERMINATED: inactive, ON_LEAVE: suspended, PENDING: inactive } }
      last_login: { path: last_login, transform: datetime }
    required: [id, email]
    on_invalid: quarantine

  list_devices:
    mode: pull
    target_schema: device
    schedule: every 1h
    request: { method: GET, path: /devices }
    records_path: "@"
    map:
      id: id
      hostname: hostname
      ip: ip_address
      os: os
      owner: owner
      last_seen: { path: last_seen, transform: datetime }
    required: [id]
    on_invalid: quarantine
