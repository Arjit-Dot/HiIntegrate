# Preloaded at start. One action per failure case. Each runs once by itself within about 15 seconds of the start (then hourly),
# so the Runs page and the Integrations page already show the results when the judges arrive.
version: 1
name: demo-failures
display_name: "Demo: failure cases"
category: other
description: "The demo mock service failing in four different ways on purpose."
enabled: true
requires:
  secrets: [mock_token]
base_url: "http://mock-api:8001"
auth: { type: api_key, in: header, name: Authorization, prefix: "SSWS ", secret: mock_token }
defaults:
  timeout_seconds: 3
actions:
  wrong_key:
    mode: pull
    target_schema: user
    schedule: every 1h
    request: { method: GET, path: /wrong-key }
    records_path: "@"
    map: &user_map
      id: id
      name: name
      email: { path: email, transform: lowercase }
      status: { path: status, value_map: { active: active, disabled: inactive }, default: unknown }
      last_login: { path: last_login, transform: datetime }
    required: [id]
    on_invalid: quarantine

  network_drop:
    mode: pull
    target_schema: user
    schedule: every 1h
    request: { method: GET, path: /drop }
    records_path: "@"
    retry: { max_retries: 2, backoff_seconds: [0.5] }
    map: *user_map
    required: [id]
    on_invalid: quarantine

  rate_limited:
    mode: pull
    target_schema: user
    schedule: every 1h
    request: { method: GET, path: /rate-limited, query: { times: 1, retry_after: 2 } }
    records_path: "@"
    map: *user_map
    required: [id]
    on_invalid: quarantine

  flaky:
    mode: pull
    target_schema: user
    schedule: every 1h
    request: { method: GET, path: /flaky, query: { fail: 2 } }
    records_path: "@"
    map: *user_map
    required: [id]
    on_invalid: quarantine

  error_body:
    mode: pull
    target_schema: user
    schedule: every 1h
    request: { method: GET, path: /error-body }
    records_path: "@"
    error_when: { path: ok, equals: false, message_path: error }
    map: *user_map
    required: [id]
    on_invalid: quarantine
