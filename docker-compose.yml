# HiIntegrate: the whole stack.   docker compose up --build
# Needs a .env in this folder (names are in README.md). It is never committed and never copied into an image.
# At least: POSTGRES_PASSWORD, ENCRYPTION_KEY, and one SECRET_<NAME> (plus SECRET_<NAME>_HOST) per service you call.
#
# Security (D-17): only the dashboard is published, and only on 127.0.0.1 (S-1). The API, the worker, the mock and the
# database are reachable only from inside Compose; the dashboard forwards /api to the API. Set DASHBOARD_PASSWORD in
# .env to put a password in front of the dashboard and the API (S-3). To reach the API or the mock directly from this
# machine while developing, add the debug file:  docker compose -f docker-compose.yml -f docker-compose.debug.yml up

x-hardened: &hardened          # S-4: no extra privileges, no Linux capabilities, a read-only filesystem
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - path: .env
      required: false          # a fresh clone has no .env yet; the checks below say what is missing
  environment:
    # Inside Compose the database is the `postgres` service, whatever .env says for local runs.
    DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/hiintegrate
    CORS_ORIGINS: '["http://localhost:5173"]'
    # A test value for the mock service only (not a real key). Pinned to the mock's own host.
    SECRET_MOCK_TOKEN: mock-secret-123
    SECRET_MOCK_TOKEN_HOST: mock-api
    # D-18: SECRET_<NAME> variables belong to the whole server, so only the ONE account named here can use them.
    # Leave it empty to let nobody use them (every person then enters their own keys on the Secrets page).
    ENV_SECRETS_ACCOUNT: ${ENV_SECRETS_ACCOUNT:-}
    ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
  restart: unless-stopped

services:
  postgres:
    <<: *hardened
    image: postgres:16
    cap_add:                   # what the image needs to drop from root to the postgres user and own its data directory
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    tmpfs:
      - /tmp
      - /var/run/postgresql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hiintegrate
    volumes:
      - hiintegrate-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hiintegrate"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    <<: [*backend, *hardened]
    # Each service has its own image name. Three services building ONE name at the same time race on the final
    # export ("image already exists"); the layers are shared, so the extra names cost nothing.
    image: hiintegrate-backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Scheduled pulls and alert emails. Same image and settings; waits for the API, which creates the tables.
  worker:
    <<: [*backend, *hardened]
    image: hiintegrate-worker
    command: ["python", "-m", "app.worker"]
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    <<: *hardened
    build: ./frontend
    image: hiintegrate-frontend
    ports:
      - "127.0.0.1:5173:80"    # the only published port, and only on this machine
    cap_add:                   # nginx starts as root, then drops to its own user and binds port 80
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    tmpfs:                     # nginx writes its rendered config, its password file, its cache and its pid here
      - /tmp
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/run
    environment:
      DASHBOARD_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}   # empty = no password (v1 default, D-6)
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  # The local test target for the failure tests. Not a data source. It gets no .env, so no real token reaches it.
  mock-api:
    <<: *hardened
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: hiintegrate-mock-api
    command: ["uvicorn", "tests.mock_api.app:app", "--host", "0.0.0.0", "--port", "8001"]
    restart: unless-stopped

volumes:
  hiintegrate-db:
