# Rendered at container start (the nginx image fills in ${AUTH_BASIC}; see docker/15-auth.envsh).
server {
  listen 80;
  server_name _;
  server_tokens off;

  # TLS (D-17 S-13): empty unless a certificate is mounted at /certs (see docker/15-auth.envsh and docker-compose.tls.yml).
  include /tmp/tls.conf;
  root /usr/share/nginx/html;
  index index.html;

  auth_basic ${AUTH_BASIC};
  auth_basic_user_file /tmp/htpasswd;

  # Security headers (D-17 S-2). The editor (Monaco) loads from cdn.jsdelivr.net, so only that outside address is allowed.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # The API. The browser calls /api/v1/... on this address, so no CORS is needed.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 120s;   # a real test or lookup can take a while
  }

  # The single-page app: any other path serves index.html (React Router handles it).
  location / {
    try_files $uri /index.html;
  }
}
