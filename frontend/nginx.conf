server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The API. The browser calls /api/v1/... on this address, so no CORS is needed.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 120s;   # a real test or lookup can take a while
  }

  # The single-page app: any other path serves index.html (React Router handles it).
  location / {
    try_files $uri /index.html;
  }
}
