openapi: 3.1.0
info:
  title: Integration Platform API
  version: 1.0.0
  description: |
    The contract between the dashboard (Person B) and the backend (Person A).

    - Base path `/api/v1`. JSON only, except that configs may also be sent as YAML text.
    - Timestamps are ISO 8601 UTC. Integrations are identified by their `name` slug.
    - Errors always use `{"error": {"code", "message", "details"}}`.
    - Lists use `limit` (default 50, maximum 500) and `offset` (default 0), and reply `{items, total, limit, offset}`.
    - Every route except `/health`, `/auth/register` and `/auth/login` needs a sign-in (D-18): send the token from `/auth/login` in the `X-Session-Token` header. Each account sees only its own integrations, records, runs, quarantine and secrets. A missing, wrong or expired token gives 401.
    - Routes that change data, start runs or call the AI are limited per account per minute (S-9): over the limit the answer is 429 `rate_limited` with a `Retry-After` header (seconds). Reads and validation are not limited.
    - Record and run shapes live in `result.schema.json`. The config shape lives in `integration.schema.json`.
servers:
  - url: http://localhost:8000/api/v1
    description: Backend. The frontend mock (Prism) runs on http://localhost:4010 from this file.

security:
  - sessionToken: []   # D-18. Routes that are open say `security: []`.

tags:
  - { name: Auth, description: "Create an account, sign in and out." }
  - { name: Integrations, description: "Add, change, validate and test integrations." }
  - { name: Runs, description: "Run actions and read run history." }
  - { name: Data, description: "Stored records and quarantine." }
  - { name: Secrets, description: "Write-only secret names and values." }
  - { name: Templates, description: "Prebuilt configs." }
  - { name: AI, description: "Optional extras. The engine never calls them." }
  - { name: Audit, description: "Who changed what (names and revisions, never values)." }

paths:
  /health:
    get:
      tags: [Integrations]
      summary: The service is up
      operationId: getHealth
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [status], properties: { status: { const: ok } } }
              example: { status: ok }

  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account and sign in
      operationId: register
      security: []
      description: Usernames are lowercased (3 to 32 characters of letters, digits, dot, dash, underscore). Passwords are 8 to 128 characters and are stored only as a salted scrypt hash. The server can close registration with `ALLOW_REGISTRATION=false` (403).
      requestBody: { $ref: "#/components/requestBodies/Credentials" }
      responses:
        "201": { $ref: "#/components/responses/SignedIn" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403":
          description: Registration is closed on this server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: unauthorized, message: Registration is closed on this server., details: null } }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      operationId: login
      security: []
      description: A wrong password and an unknown username give the same 401. After 8 wrong passwords for one username in 5 minutes the answer is 429 `rate_limited` until the window passes.
      requestBody: { $ref: "#/components/requestBodies/Credentials" }
      responses:
        "200": { $ref: "#/components/responses/SignedIn" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: Too many wrong passwords for this username.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: rate_limited, message: Too many wrong passwords for this username. Wait a few minutes and try again., details: null } }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Sign out (the token stops working)
      operationId: logout
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/me:
    get:
      tags: [Auth]
      summary: Who the token belongs to
      operationId: getMe
      responses:
        "200":
          description: The signed-in account
          content:
            application/json:
              schema: { type: object, required: [username], properties: { username: { type: string } } }
              example: { username: ada }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /integrations:
    get:
      tags: [Integrations]
      summary: List integrations, with their health
      operationId: listIntegrations
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - { name: category, in: query, schema: { enum: [identity, threat_intel, ticketing, alerting, other] } }
        - { name: status, in: query, description: Health status., schema: { enum: [never_run, healthy, degraded, failing, disabled] } }
        - { name: q, in: query, description: Search by name., schema: { type: string } }
      responses:
        "200":
          description: A page of integrations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/IntegrationSummary" } }
              example:
                items:
                  - name: github
                    display_name: GitHub
                    category: identity
                    enabled: true
                    auth_type: bearer
                    schemas: [user]
                    actions: [{ name: list_members, mode: pull }, { name: get_user, mode: lookup }]
                    health: { status: healthy, last_run_at: "2026-01-01T09:05:00Z", records_pulled: 1240, last_error: null, consecutive_failures: 0 }
                total: 1
                limit: 50
                offset: 0
    post:
      tags: [Integrations]
      summary: Create an integration from a config
      description: The body is a config, as JSON or as YAML text. The config is validated first.
      operationId: createIntegration
      requestBody: { $ref: "#/components/requestBodies/Config" }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Integration" } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /integrations/validate:
    post:
      tags: [Integrations]
      summary: Check a config and return every error with its field path
      description: Nothing is saved. Bonus B-2.
      operationId: validateIntegration
      requestBody: { $ref: "#/components/requestBodies/Config" }
      responses:
        "200":
          description: The result. `valid` is false when `errors` has any entry with severity `error`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidateResponse" }
              example:
                valid: false
                errors:
                  - { path: "actions.list_users.pagnation", message: is not a known key, severity: error }
                  - { path: auth.secret, message: "must be a name (letters, digits, underscores, up to 64), not a key", severity: error }

  /integrations/{id}:
    parameters:
      - $ref: "#/components/parameters/integrationId"
    get:
      tags: [Integrations]
      summary: Read an integration
      operationId: getIntegration
      responses:
        "200":
          description: The config and its health
          content: { application/json: { schema: { $ref: "#/components/schemas/Integration" } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Integrations]
      summary: Replace an integration's config
      description: |
        Replaces the whole config. To add an action, send the config with the new action included.
        The `name` in the body must match `{id}`. Changing it is not allowed, because records are keyed by it.
      operationId: replaceIntegration
      requestBody: { $ref: "#/components/requestBodies/Config" }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/Integration" } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Integrations]
      summary: Remove an integration
      operationId: deleteIntegration
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /integrations/{id}/enabled:
    parameters:
      - $ref: "#/components/parameters/integrationId"
    patch:
      tags: [Integrations]
      summary: Turn scheduled runs on or off
      operationId: setEnabled
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [enabled], properties: { enabled: { type: boolean } } }
      responses:
        "200":
          description: The updated summary
          content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationSummary" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /integrations/{id}/health:
    parameters:
      - $ref: "#/components/parameters/integrationId"
    get:
      tags: [Integrations]
      summary: The health of one integration
      operationId: getIntegrationHealth
      responses:
        "200":
          description: Health
          content:
            application/json:
              schema: { $ref: "result.schema.json#/$defs/health" }
              example: { status: failing, last_run_at: "2026-01-01T09:06:00Z", records_pulled: 0, last_error: { code: auth_failed, message: Authentication failed (401) }, consecutive_failures: 3 }
        "404": { $ref: "#/components/responses/NotFound" }

  /integrations/{id}/test:
    parameters:
      - $ref: "#/components/parameters/integrationId"
    post:
      tags: [Integrations]
      summary: Call the service once and show the raw reply beside the mapped record
      description: First page only. Nothing is saved. The run is recorded with trigger `test` and is ignored by the health view. Bonus B-3.
      operationId: testIntegration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string }
                inputs: { type: object, additionalProperties: true, description: Needed for a lookup action. }
      responses:
        "200":
          description: The test result. `ok` is false when the call failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestResponse" }
              example:
                ok: true
                status_code: 200
                latency_ms: 312
                pages_fetched: 1
                raw_sample: { id: 4021, login: ada-l }
                mapped_sample: { id: "4021", name: ada-l, status: active, source: github, fetched_at: "2026-01-01T09:05:00Z" }
                missing_paths: [email]
                notes: []
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /integrations/{id}/actions/{action}/run:
    parameters:
      - $ref: "#/components/parameters/integrationId"
      - { name: action, in: path, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9_]*$" } }
    post:
      tags: [Runs]
      summary: Run an action
      description: |
        A `pull` returns `202` with a `run_id` and finishes in the background. Poll `GET /runs/{run_id}`.
        A `lookup` returns `200` with the mapped record straight away. Its inputs are type-checked before any request is sent.
        Starting an action that is already running returns `409`.
        A lookup whose call fails returns `502` with code `run_failed`, and the run is still recorded.
      operationId: runAction
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                inputs: { type: object, additionalProperties: true, description: "The lookup's inputs, by name." }
            example: { inputs: { id: "00u1ada" } }
      responses:
        "200":
          description: A lookup. The mapped record.
          headers:
            X-Run-Id: { description: The run recorded for this lookup., schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "result.schema.json" }
              example: { id: "00u1ada", name: ada@acme.com, email: ada@acme.com, status: active, last_login: "2025-12-31T17:20:00Z", source: okta, fetched_at: "2026-01-01T09:05:00Z" }
        "202":
          description: A pull. It was started.
          content:
            application/json:
              schema: { type: object, required: [run_id, status], properties: { run_id: { type: string }, status: { const: running } } }
              example: { run_id: run-5533, status: running }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/Unsupported" }
        "502":
          description: A lookup failed at the service. The run is recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: run_failed, message: Authentication failed (401), details: { run_id: run-5534, error_code: auth_failed } } }
        "429": { $ref: "#/components/responses/RateLimited" }

  /runs:
    get:
      tags: [Runs]
      summary: Run history, newest first
      operationId: listRuns
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - { name: integration, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { enum: [running, success, failed] } }
      responses:
        "200":
          description: A page of runs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "result.schema.json#/$defs/run_record" } }
              example:
                items:
                  - { run_id: run-5532, integration: okta, action: list_users, mode: pull, trigger: schedule, status: failed, started_at: "2026-01-01T09:06:00Z", finished_at: "2026-01-01T09:06:01Z", duration_ms: 400, pages_fetched: 0, records_pulled: 0, records_valid: 0, records_invalid: 0, retries: 0, error: { code: auth_failed, message: Authentication failed (401) } }
                  - { run_id: run-5531, integration: github, action: list_members, mode: pull, trigger: schedule, status: success, started_at: "2026-01-01T09:05:00Z", finished_at: "2026-01-01T09:05:06Z", duration_ms: 6200, pages_fetched: 13, records_pulled: 1240, records_valid: 1240, records_invalid: 0, retries: 0, error: null }
                total: 2
                limit: 50
                offset: 0

    delete:
      tags: [Runs]
      summary: Delete finished runs older than a number of days
      description: |
        Retention (S-10). Deletes this account's finished runs that started more than N days ago. A run that is still running, and the newest finished run of each action (so health keeps its last result), are always kept. The worker also does this once a day, with `RETENTION_RUNS_DAYS`, `RETENTION_QUARANTINE_DAYS` and `RETENTION_AUDIT_DAYS` (default 90, 90 and 365 days; 0 keeps everything). The change is recorded in the audit log.
      operationId: deleteOldRuns
      parameters:
        - { name: older_than_days, in: query, required: true, description: "0 or more. 0 means everything that can be deleted.", schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: How many were deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [deleted]
                properties:
                  deleted: { type: integer, minimum: 0 }
              example: { deleted: 42 }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /runs/{run_id}:
    parameters:
      - { name: run_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Runs]
      summary: One run
      operationId: getRun
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "result.schema.json#/$defs/run_record" }
              example:
                run_id: run-5531
                integration: github
                action: list_members
                mode: pull
                trigger: schedule
                status: success
                started_at: "2026-01-01T09:05:00Z"
                finished_at: "2026-01-01T09:05:06Z"
                duration_ms: 6200
                pages_fetched: 13
                records_pulled: 1240
                records_valid: 1240
                records_invalid: 0
                retries: 0
                error: null
        "404": { $ref: "#/components/responses/NotFound" }

  /audit:
    get:
      tags: [Audit]
      summary: The audit log, newest first
      description: |
        One entry for every change you made (S-7): an integration created, updated, enabled, disabled or deleted, a secret set, an action tested or run by hand. Entries hold names, the integration `revision` and the request id (the `X-Request-Id` the API sent back), and never a secret value or a config body. You see only your own account's entries.
      operationId: listAudit
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - { name: event, in: query, description: "Only this event, e.g. `secret.set`.", schema: { type: string } }
        - { name: target, in: query, description: "Only this integration, secret name or `integration/action`.", schema: { type: string } }
      responses:
        "200":
          description: A page of audit entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
              example:
                items:
                  - { id: 7, at: "2026-01-01T09:07:00Z", event: secret.set, target: github_token, revision: null, request_id: 3f9c1a2b7d4e }
                  - { id: 6, at: "2026-01-01T09:05:00Z", event: integration.updated, target: github, revision: 2, request_id: 8a1d0c5e9b22 }
                total: 2
                limit: 50
                offset: 0
        "401": { $ref: "#/components/responses/Unauthorized" }

  /results:
    get:
      tags: [Data]
      summary: Stored records of one type
      operationId: listResults
      parameters:
        - { name: target, in: query, required: true, schema: { enum: [user, device, alert] } }
        - { name: source, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: A page of records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          anyOf:
                            - $ref: "result.schema.json#/$defs/user"
                            - $ref: "result.schema.json#/$defs/device"
                            - $ref: "result.schema.json#/$defs/alert"
              example:
                items:
                  - { id: "4021", name: ada-l, status: active, source: github, fetched_at: "2026-01-01T09:05:00Z" }
                  - { id: "5b10a1", name: Grace Hopper, email: grace@acme.com, status: active, source: jira, fetched_at: "2026-01-01T09:00:00Z" }
                  - { id: "00u1alan", name: Alan Turing, email: alan@acme.com, status: suspended, last_login: "2025-11-02T08:30:00Z", source: okta, fetched_at: "2026-01-01T09:05:00Z" }
                total: 3
                limit: 50
                offset: 0
        "400": { $ref: "#/components/responses/ValidationError" }

  /users/unified:
    get:
      tags: [Data]
      summary: Users merged across services (D-16)
      description: One entry per person. Users are matched by lowercased email, and each entry lists every service the person appears in. Built from the stored users, so nothing extra is stored.
      operationId: listUnifiedUsers
      parameters:
        - { name: source, in: query, description: Only people who appear in this service, schema: { type: string } }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: A page of unified users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "result.schema.json#/$defs/unified_user"
              example:
                items:
                  - key: grace@acme.com
                    email: grace@acme.com
                    name: Grace Hopper
                    last_login: "2025-12-20T10:00:00Z"
                    sources:
                      - { source: jira, id: 5b10a1, status: active, last_login: null, fetched_at: "2026-01-01T09:00:00Z" }
                      - { source: okta, id: 00u1grace, status: active, last_login: "2025-12-20T10:00:00Z", fetched_at: "2026-01-01T09:05:00Z" }
                  - key: "github:4021"
                    email: null
                    name: ada-l
                    last_login: null
                    sources:
                      - { source: github, id: "4021", status: active, last_login: null, fetched_at: "2026-01-01T09:05:00Z" }
                total: 2
                limit: 50
                offset: 0
        "400": { $ref: "#/components/responses/ValidationError" }

  /quarantine:
    get:
      tags: [Data]
      summary: Quarantined records, paged
      operationId: listQuarantine
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/qSource"
        - $ref: "#/components/parameters/qAction"
        - $ref: "#/components/parameters/qRun"
        - $ref: "#/components/parameters/qSchema"
        - $ref: "#/components/parameters/qReason"
      responses:
        "200":
          description: A page of quarantined records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "result.schema.json#/$defs/quarantine_record" } }
              example:
                items:
                  - { source: github, action: list_members, target_schema: user, run_id: run-0001, raw: { login: ghost-account, type: User }, reason: missing_required_field, field: id, created_at: "2026-01-01T09:05:03Z" }
                  - { source: okta, action: list_users, target_schema: user, run_id: run-0001, raw: { id: 00u1bad, lastLogin: "31/31/2025" }, reason: transform_failed, field: last_login, created_at: "2026-01-01T09:05:03Z" }
                total: 2
                limit: 50
                offset: 0

    delete:
      tags: [Data]
      summary: Delete quarantined records older than a number of days
      description: |
        Retention (S-10). Deletes this account's quarantined records created more than N days ago. Stored users, devices and alerts are not touched. The worker also does this once a day, with `RETENTION_RUNS_DAYS`, `RETENTION_QUARANTINE_DAYS` and `RETENTION_AUDIT_DAYS` (default 90, 90 and 365 days; 0 keeps everything). The change is recorded in the audit log.
      operationId: deleteOldQuarantine
      parameters:
        - { name: older_than_days, in: query, required: true, description: "0 or more. 0 means everything that can be deleted.", schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: How many were deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [deleted]
                properties:
                  deleted: { type: integer, minimum: 0 }
              example: { deleted: 42 }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /quarantine/export:
    get:
      tags: [Data]
      summary: Every quarantined record, unpaged
      description: Takes the same filters as `/quarantine` and ignores `limit` and `offset`. Sent as a file download.
      operationId: exportQuarantine
      parameters:
        - $ref: "#/components/parameters/qSource"
        - $ref: "#/components/parameters/qAction"
        - $ref: "#/components/parameters/qRun"
        - $ref: "#/components/parameters/qSchema"
        - $ref: "#/components/parameters/qReason"
      responses:
        "200":
          description: A JSON array
          headers:
            Content-Disposition: { description: 'attachment; filename="quarantine.json"', schema: { type: string } }
          content:
            application/json:
              schema: { type: array, items: { $ref: "result.schema.json#/$defs/quarantine_record" } }
              example:
                - { source: github, action: list_members, target_schema: user, run_id: run-0001, raw: { login: ghost-account, type: User }, reason: missing_required_field, field: id, created_at: "2026-01-01T09:05:03Z" }

  /secrets:
    get:
      tags: [Secrets]
      summary: List secret names. Values are never returned.
      operationId: listSecrets
      responses:
        "200":
          description: Names and whether each is set
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SecretInfo" }
              example: { items: [{ name: github_token, set: true, host: api.github.com, updated_at: "2025-12-30T10:00:00Z" }, { name: smtp_password, set: false, host: null, updated_at: null }] }

  /secrets/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_]{1,64}$" } }
    put:
      tags: [Secrets]
      summary: Set or replace a secret's value
      description: Write-only. Used by the Secrets screen and by the Add/Edit form (which stores the value before it saves the integration). The secret is **pinned to `host`**, and the engine refuses to send it to any other host. Setting a secret again with a new host re-pins it. Returns `501` until the encrypted store exists (Phase 2), because environment variables are the only source before that.
      operationId: setSecret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value, host]
              properties:
                value: { type: string, minLength: 1, writeOnly: true }
                host: { type: string, pattern: "^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$", description: "The only host this secret may be sent to, such as api.github.com. Lowercase, no scheme, no path, no port." }
            example: { value: "paste-the-token-here", host: api.github.com }
      responses:
        "204": { description: Stored }
        "400": { $ref: "#/components/responses/ValidationError" }
        "501": { $ref: "#/components/responses/Unsupported" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /templates:
    get:
      tags: [Templates]
      summary: Prebuilt configs
      operationId: listTemplates
      responses:
        "200":
          description: Template summaries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TemplateSummary" }
              example:
                items:
                  - { id: github, display_name: GitHub, category: identity, description: "Lists the members of a GitHub organization and looks up one user.", requires: { vars: { org: { label: "GitHub organization", example: my-org } }, secrets: [github_token] } }
                  - { id: generic-user, display_name: "Generic user source", category: identity, description: "Starter for any service that lists users." }

  /templates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Templates]
      summary: One template, as a config and as YAML text
      operationId: getTemplate
      responses:
        "200":
          description: The template
          content:
            application/json:
              schema:
                type: object
                required: [id, config, yaml]
                properties:
                  id: { type: string }
                  config: { $ref: "integration.schema.json" }
                  yaml: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /ai/generate-config:
    post:
      tags: [AI]
      summary: Draft a config from API docs, a curl example or a sample response
      description: The draft is validated and returned for a human to review. Nothing is saved. Secrets are never sent to the model.
      operationId: generateConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              anyOf: [{ required: [text] }, { required: [url] }, { required: [service] }]
              properties:
                service: { type: string, minLength: 1, maxLength: 100, description: "AI mode: a service name such as `Jira`. The AI finds the API documentation, trying several pages before giving up. Ignored for searching when `url` or `text` is also sent." }
                text: { type: string, minLength: 1, description: "Pasted docs, a curl example, a sample response, or the text of an attached document. HTML is turned into plain text." }
                url: { type: string, minLength: 1, maxLength: 2000, description: "AI mode: an https documentation page (or an OpenAPI file). The server reads it. Private addresses and non-text pages are refused with 422." }
      responses:
        "200":
          description: A draft
          content:
            application/json:
              schema:
                type: object
                required: [yaml, errors]
                properties:
                  yaml: { type: string }
                  config: { type: object, additionalProperties: true }
                  errors: { type: array, items: { $ref: "#/components/schemas/ValidationIssue" } }
                  source:
                    type: object
                    description: "Present when `url` was sent: the page that was read."
                    required: [url, chars, truncated]
                    properties:
                      url: { type: string, description: "The final address, after redirects." }
                      chars: { type: integer, description: "Readable characters on the page." }
                      truncated: { type: boolean, description: "True when only the first 50,000 characters went to the model." }
                  test:
                    type: object
                    description: "Present when the draft was tried against the real service (first page, nothing saved). Only a secret that already exists and is pinned to the host the config calls is ever used, so a draft written from a web page cannot send it anywhere else. Real records are not returned."
                    required: [ran, missing_paths, notes, filled_vars]
                    properties:
                      ran: { type: boolean }
                      skipped_reason: { type: string, description: "Why it was not tried." }
                      action: { type: string, description: "The pull action that was tried." }
                      ok: { type: boolean, description: "Whether the service answered with usable records." }
                      status_code: { type: [integer, "null"] }
                      missing_paths: { type: array, items: { type: string }, description: "Mapped fields that found nothing in the real record." }
                      notes: { type: array, items: { type: string } }
                      filled_vars: { type: object, additionalProperties: true, description: "Variables filled in for the person: the site or domain from the secret's pinned host, and values copied from a saved integration that uses the same secret on the same host." }
                      corrected: { type: boolean, description: "True when the model fixed the draft after the first test and the fix was tested again." }
                      missing_before: { type: array, items: { type: string }, description: "With `corrected`: the fields that found nothing before the fix." }
                  tried:
                    type: array
                    description: "Present when `service` was searched: every page tried, in order. The last one is the page the draft came from. On 422 the same list is in `error.details.tried`."
                    items:
                      type: object
                      required: [url, ok, reason]
                      properties:
                        url: { type: string }
                        ok: { type: boolean }
                        reason: { type: [string, "null"], description: "Why the page was not used, or null." }
                  attempts:
                    type: array
                    description: "One entry per try: the first draft and up to two corrections after the validator's complaints."
                    items:
                      type: object
                      required: [attempt, valid, error_count]
                      properties:
                        attempt: { type: integer, minimum: 1 }
                        valid: { type: boolean }
                        error_count: { type: integer, minimum: 0 }
        "422": { $ref: "#/components/responses/ValidationError" }
        "501": { $ref: "#/components/responses/Unsupported" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /ai/suggest-mapping:
    post:
      tags: [AI]
      summary: Suggest which path of a pasted sample feeds each field of a schema, and check it
      description: |
        Paste a sample response. The platform finds the records in it. Without `mapping`, the model suggests a JMESPath for each
        field of `target_schema` (with a transform, a `value_map` where the field has fixed values, and a confidence), and the
        platform then checks every suggestion against the real sample records: how many records the path finds a value in, an
        example value, and a preview of the first record as the mapper would save it (or why it would be quarantined).
        A confidence is lowered when the path does not hold up. With `mapping` (entries a person wrote or edited) no model is
        called, so it works with AI switched off. Nothing is saved. Records sent to the model are masked (D-14).
      operationId: suggestMapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_schema, sample]
              properties:
                target_schema: { enum: [user, device, alert] }
                sample: { description: "A list of records, an object holding a list of records, or one record. At least one record." }
                mapping:
                  type: object
                  description: "Check these entries instead of asking the model. Keys are field names of the schema."
                  additionalProperties:
                    type: object
                    properties:
                      path: { type: string }
                      transform: { type: [string, "null"] }
                      value_map: { type: [object, "null"], additionalProperties: { type: string } }
      responses:
        "200":
          description: The checked suggestions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MappingSuggestion" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "501": { $ref: "#/components/responses/Unsupported" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /ai/summarize:
    post:
      tags: [AI]
      summary: A plain-language summary of the stored records
      operationId: summarize
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                target: { enum: [user, device, alert] }
                source: { type: string }
      responses:
        "200":
          description: The summary
          content:
            application/json:
              schema: { type: object, required: [summary], properties: { summary: { type: string } } }
        "501": { $ref: "#/components/responses/Unsupported" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /ai/propose-fix:
    post:
      tags: [AI]
      summary: Propose a config fix for quarantined records or a failed run, and check it
      description: |
        The model suggests a change to the integration's config. The platform then checks the suggestion without saving anything:
        the proposed config is validated, and for `kind: quarantine` the stored raw records are mapped again with it (a dry run).
        The reply says how many records the fix would rescue. Nothing is saved and the integration is not changed.
        To apply a fix, the dashboard sends `proposed_config` to `PUT /integrations/{id}` after a person approves it.
        Secrets, auth headers and secret values are never sent to the model. Records sent to the model are capped (see docs/decisions.md D-14).
      operationId: proposeFix
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, integration, action]
              properties:
                kind: { enum: [quarantine, run_failure], description: "`quarantine` fixes rejected records. `run_failure` explains a failed run." }
                integration: { type: string, pattern: "^[a-z0-9][a-z0-9_-]*$" }
                action: { type: string }
                run_id: { type: string, description: "Optional for `quarantine` (default: every quarantined record of the action). Required for `run_failure`." }
      responses:
        "200":
          description: A proposal, which may contain no fix.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProposeFixResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "501": { $ref: "#/components/responses/Unsupported" }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    sessionToken:
      type: apiKey
      in: header
      name: X-Session-Token
      description: The `token` from `/auth/register` or `/auth/login`. It is valid for 7 days or until `/auth/logout`. (Not `Authorization`, which the optional nginx basic auth already uses.)

  parameters:
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
    offset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    integrationId:
      name: id
      in: path
      required: true
      description: The integration's `name` slug.
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9_-]*$" }
    qSource: { name: source, in: query, schema: { type: string } }
    qAction: { name: action, in: query, schema: { type: string } }
    qRun: { name: run_id, in: query, schema: { type: string } }
    qSchema: { name: target_schema, in: query, schema: { enum: [user, device, alert] } }
    qReason: { name: reason, in: query, schema: { enum: [missing_required_field, transform_failed, invalid_value] } }

  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [username, password]
            properties:
              username: { type: string }
              password: { type: string, format: password }
          example: { username: ada, password: correct horse battery }
    Config:
      required: true
      description: A config as JSON, or as YAML text. Both parse to the same thing.
      content:
        application/json:
          schema: { $ref: "integration.schema.json" }
        text/yaml:
          schema: { type: string }

  responses:
    SignedIn:
      description: Signed in. Send `token` in the `X-Session-Token` header from now on.
      content:
        application/json:
          schema:
            type: object
            required: [username, token, expires_at]
            properties:
              username: { type: string }
              token: { type: string }
              expires_at: { type: string, format: date-time }
          example: { username: ada, token: kF3x-example-token, expires_at: "2026-01-08T09:00:00Z" }
    Unauthorized:
      description: No sign-in, an unknown or expired token, or (on login) a wrong username or password.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: unauthorized, message: "Sign in first: send the session token you got from /auth/login in the X-Session-Token header.", details: null } }
    RateLimited:
      description: Too many requests from this account in the last minute (S-9). Wait `Retry-After` seconds. `details` has the `bucket` (`write`, `run` or `ai`) and `retry_after`.
      headers:
        Retry-After: { description: Seconds to wait., schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: rate_limited, message: Too many write requests. Wait 12 s and try again., details: { bucket: write, retry_after: 12 } } }
    ValidationError:
      description: The request or the config is invalid. `details.errors` lists each problem with its field path.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: validation_error, message: The config is not valid, details: { errors: [{ path: base_url, message: is required, severity: error }] } } }
    NotFound:
      description: There is no such integration, run or template.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: not_found, message: No integration named okta, details: null } }
    Conflict:
      description: The name is taken, or the action is already running.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: conflict, message: list_users is already running, details: { run_id: run-5528 } } }
    Unsupported:
      description: Not available yet (for example, the encrypted secret store before Phase 2, or a reserved feature).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: unsupported, message: The secret store is not available yet, details: null } }

  schemas:
    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, at, event, target, revision, request_id]
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        event: { type: string, description: "`integration.created`, `integration.updated`, `integration.deleted`, `integration.enabled`, `integration.disabled`, `secret.set`, `action.tested` or `action.run`." }
        target: { type: [string, "null"], description: "The integration or secret name, or `integration/action`." }
        revision: { type: [integer, "null"], description: "The integration's revision after the change, when it has one." }
        request_id: { type: [string, "null"] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { enum: [validation_error, not_found, conflict, unsupported, run_failed, internal_error, unauthorized, rate_limited] }
            message: { type: string }
            details: { description: "Extra information, or null." }
    Page:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: {} }
        total: { type: integer, minimum: 0 }
        limit: { type: integer }
        offset: { type: integer }
    ValidationIssue:
      type: object
      required: [path, message, severity]
      properties:
        path: { type: string, description: "The field path, such as actions.list_users.schedule." }
        line: { type: integer, description: "Optional. The line in the YAML text, for editor markers." }
        message: { type: string }
        severity: { enum: [error, warning] }
    MappingSuggestion:
      type: object
      required: [records_path, records_found, fields, preview]
      properties:
        records_path: { type: string, description: "Where the records sit in the sample: a key name, or `@` when the sample is the list or one record." }
        records_found: { type: integer, minimum: 0 }
        fields:
          type: array
          items:
            type: object
            required: [field, path, confidence, found, of, valid]
            properties:
              field: { type: string }
              path: { type: string, description: "A JMESPath on one record." }
              transform: { type: [string, "null"] }
              value_map: { type: [object, "null"], additionalProperties: { type: string } }
              confidence: { enum: [high, medium, low] }
              reason: { type: string }
              found: { type: integer, minimum: 0, description: "Sample records in which the path finds a value." }
              of: { type: integer, minimum: 0, description: "Sample records checked." }
              example: { description: "The first value found, or null." }
              valid: { type: boolean, description: "False when the path is not valid JMESPath." }
        preview:
          description: "The first sample record as the mapper would save it, or why it would be quarantined."
          oneOf:
            - type: object
              required: [record]
              properties: { record: { type: object, additionalProperties: true } }
            - type: object
              required: [quarantine]
              properties:
                quarantine:
                  type: object
                  required: [reason, field]
                  properties: { reason: { type: string }, field: { type: string } }
    ProposeFixResponse:
      type: object
      required: [summary, changes, errors, verification]
      properties:
        summary: { type: string, description: "A plain-language explanation of the cause and the fix." }
        changes:
          type: array
          description: "Empty when the model found no fix (the summary then explains why)."
          items:
            type: object
            required: [path, after, reason]
            properties:
              path: { type: string, description: "The config field, such as actions.list_users.map.status.value_map." }
              before: { description: "The current value, or null if the field is new." }
              after: { description: "The proposed value." }
              reason: { type: string }
        proposed_config: { type: object, additionalProperties: true, description: "The whole config with the changes applied. Absent when `changes` is empty." }
        errors:
          type: array
          description: "Validation problems in `proposed_config`. If not empty, the proposal must not be applied."
          items: { $ref: "#/components/schemas/ValidationIssue" }
        verification:
          description: "The dry-run result. Null for `run_failure`, when `changes` is empty, or when `errors` is not empty."
          oneOf:
            - { type: "null" }
            - type: object
              required: [checked, rescued, still_quarantined, mapped_samples]
              properties:
                checked: { type: integer, minimum: 0, description: "Stored quarantined records mapped again (at most 200)." }
                rescued: { type: integer, minimum: 0, description: "Records that now map to a valid record." }
                still_quarantined: { type: integer, minimum: 0 }
                mapped_samples: { type: array, maxItems: 3, items: {}, description: "Up to three records as they would be saved." }
    ValidateResponse:
      type: object
      required: [valid, errors]
      properties:
        valid: { type: boolean }
        errors: { type: array, items: { $ref: "#/components/schemas/ValidationIssue" } }
    TestResponse:
      type: object
      required: [ok, status_code, latency_ms, pages_fetched, raw_sample, mapped_sample, missing_paths, notes]
      properties:
        ok: { type: boolean }
        status_code: { type: [integer, "null"] }
        latency_ms: { type: [integer, "null"] }
        pages_fetched: { type: integer }
        raw_sample: { description: The first record as the service sent it. }
        mapped_sample: { description: The same record after mapping. }
        missing_paths:
          type: array
          items: { type: string }
          description: Mapped paths that were not found in the reply.
        notes: { type: array, items: { type: string } }
    IntegrationSummary:
      type: object
      required: [name, category, enabled, auth_type, schemas, actions, health]
      properties:
        name: { type: string }
        display_name: { type: string }
        category: { enum: [identity, threat_intel, ticketing, alerting, other] }
        enabled: { type: boolean }
        auth_type: { enum: [api_key, bearer, basic, oauth2_client_credentials] }
        schemas: { type: array, items: { enum: [user, device, alert] } }
        actions:
          type: array
          items:
            type: object
            required: [name, mode]
            properties: { name: { type: string }, mode: { enum: [pull, lookup, webhook] } }
        health: { $ref: "result.schema.json#/$defs/health" }
        alert: { $ref: "#/components/schemas/AlertState" }
    AlertState:
      description: "Null when the config has no `alerts` block. Otherwise the rule, and what came of the alert for the current failure streak."
      oneOf:
        - { type: "null" }
        - type: object
          required: [after_failures, to, last_attempt]
          properties:
            after_failures: { type: integer, minimum: 1 }
            to: { type: array, items: { type: string } }
            last_attempt:
              description: "Null until an alert was due in the current streak. Cleared when the action next succeeds."
              oneOf:
                - { type: "null" }
                - type: object
                  required: [action, at, outcome, failures]
                  properties:
                    action: { type: string }
                    at: { type: string, description: "ISO 8601 UTC." }
                    outcome: { enum: [sent, failed, not_configured], description: "`sent`: the email left. `failed`: the mail server refused or was unreachable (see `message`). `not_configured`: the server has no SMTP settings." }
                    failures: { type: integer, minimum: 1, description: "Failed runs in a row when the alert was due." }
                    message: { type: [string, "null"], description: "Why it failed. Never contains the password." }
    Integration:
      type: object
      required: [config, health]
      properties:
        config: { $ref: "integration.schema.json" }
        health: { $ref: "result.schema.json#/$defs/health" }
        alert: { $ref: "#/components/schemas/AlertState" }
        revision: { type: integer, minimum: 1, description: "1 when created, plus 1 on every save (D-15). Editing in place never creates a second integration." }
        created_at: { type: string }
        updated_at: { type: string }
    SecretInfo:
      type: object
      required: [name, set, host, updated_at]
      properties:
        name: { type: string }
        set: { type: boolean }
        host: { type: [string, "null"], description: "The host the secret is pinned to. Null if it has none (for example a secret read from the environment without a companion host)." }
        updated_at: { type: [string, "null"] }
    TemplateSummary:
      type: object
      required: [id, display_name, category, description]
      properties:
        id: { type: string }
        display_name: { type: string }
        category: { enum: [identity, threat_intel, ticketing, alerting, other] }
        description: { type: string }
        requires: { type: object, additionalProperties: true, description: "What the user must supply, from the config's requires block." }
