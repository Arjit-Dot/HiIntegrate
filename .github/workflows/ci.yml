# CI (D-17 S-13): tests, the contract check, dependency audits and an image scan on every push and pull request.
# A failing audit or scan fails the build, so a known-vulnerable dependency cannot reach main unseen.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pip-audit
      - run: ruff check .
      - run: pytest -q
      - name: Dependency audit (known vulnerabilities in requirements.txt)
        run: pip-audit -r requirements.txt

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: schema/tools/package-lock.json
      - run: npm ci && npm run check
        working-directory: schema/tools
      - run: npx --yes @redocly/cli lint schema/openapi.yaml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Dependency audit (high and critical, including dev tools)
        run: npm audit --audit-level=high

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      POSTGRES_PASSWORD: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build backend frontend
      - name: Scan the backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: hiintegrate-backend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan the dashboard image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: hiintegrate-frontend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
