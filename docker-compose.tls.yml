# HTTPS for the dashboard (D-17 S-13). Use for anything beyond your own machine:
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up --build
# Put the certificate at ./certs/tls.crt and the private key at ./certs/tls.key (both ignored by git). For a quick local
# test make a self-signed pair:
#   mkdir -p certs && openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj "/CN=localhost" \
#     -keyout certs/tls.key -out certs/tls.crt
# TLS_BIND is the address to listen on (default 127.0.0.1; use 0.0.0.0 only WITH a password, S-3, and a real certificate)
# and TLS_PORT the port (default 5443). Plain http on 5173 then redirects to https.
services:
  frontend:
    ports:
      - "${TLS_BIND:-127.0.0.1}:${TLS_PORT:-5443}:443"
    cap_add:                   # lets nginx (root, with every capability dropped) read a private key that is mode 0600 on the host
      - DAC_READ_SEARCH
    environment:
      TLS_PUBLIC_PORT: ${TLS_PORT:-5443}
    volumes:
      - ./certs:/certs:ro
